name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Backend startup smoke
        run: |
          cd backend
          python -c "from app.main import app; print('OK')"
      - name: Unit tests (cost engine + dxf parser)
        run: |
          cd backend
          pytest tests/unit/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Node 24 → npm 11, la stessa versione con cui si genera in locale il
          # package-lock.json. Con Node 20 (npm 10) `npm ci` lo considerava
          # out-of-sync sui binari-piattaforma di esbuild e falliva a ogni push.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit
